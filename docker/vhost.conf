# Laravel is served from public/; everything else stays outside the web root.
<VirtualHost *:8080>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
        DirectoryIndex index.php
    </Directory>

    # Container convention: logs go to the platform, not to files.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
